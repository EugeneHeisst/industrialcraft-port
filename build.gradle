plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
version = '0.1.33'
group = 'dev.eugheist'
base { archivesName = 'industrialcraft2-modern' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
neoForge {
    version = '21.1.256'
    parchment { mappingsVersion = '2024.11.17'; minecraftVersion = '1.21.1' }
    runs {
        client { client(); gameDirectory = file('run'); programArguments.addAll '--width', '1280', '--height', '900' }
        server { server(); gameDirectory = file('run-server'); programArgument '--nogui' }
        worldgen { server(); gameDirectory = file('run-wg'); programArgument '--nogui'; systemProperty 'ic2.audit', 'worldgen' }
        audit {
            client()
            gameDirectory = file('run-audit')
            programArguments.addAll '--width', '1280', '--height', '900', '--quickPlaySingleplayer', 'IC2Audit'
            systemProperty 'ic2.audit', 'client'
        }
        mpclient {
            client()
            gameDirectory = file('run-mp')
            programArguments.addAll '--width', '1280', '--height', '900', '--quickPlayMultiplayer', '127.0.0.1:25581', '--username', 'IC2Flyer'
            systemProperty 'ic2.audit', 'mpclient'
        }
    }
    mods { ic2 { sourceSet sourceSets.main } }
}
// JEI remains optional at runtime; compilation uses Maven or an explicit local dependency.
repositories { maven { url = 'https://maven.blamejared.com' } }
def jeiName = 'jei-1.21.1-neoforge-19.57.0.451.jar'
def jeiOverride = providers.gradleProperty('jeiLocalJar').orElse(providers.gradleProperty('jeiJar')).orElse(providers.environmentVariable('JEI_JAR')).orNull
def jeiLocal = jeiOverride != null ? file(jeiOverride) : file("deps/$jeiName")
if (jeiOverride != null && !jeiLocal.isFile()) {
    throw new GradleException("JEI dependency does not exist: $jeiLocal")
}
def jeiDependency = jeiLocal.isFile() ? files(jeiLocal) : 'mezz.jei:jei-1.21.1-neoforge:19.57.0.451'
dependencies {
    compileOnly jeiDependency
    if (providers.gradleProperty('withJei').getOrElse('false').toBoolean()) runtimeOnly jeiDependency
}
processResources { inputs.property 'version', version; filesMatching('META-INF/neoforge.mods.toml') { expand version: version } }
